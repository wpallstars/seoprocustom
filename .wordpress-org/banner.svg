<?xml version="1.0" encoding="UTF-8"?>
<!--
  SEO Pro Custom banner (WordPress.org banners, View details and the Read Me tab).
  Source: .wordpress-org/banner.svg. Edit that, then run scripts/build-banner.sh.
  Branding follows wpallstars.com: navy, red and cream, Zilla Slab italic
  headings, the wpallstars plugin stack in red only, the logo's arc of five stars and its red double stripes (here with cream between).
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1544" height="500" viewBox="0 0 1544 500">
  <title>WPALLSTARS SEO Pro Custom: Customise your site safely</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000c1f"/>
      <stop offset="0.55" stop-color="#001537"/>
      <stop offset="1" stop-color="#0d264d"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="1214" cy="270" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bb0000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#bb0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-red" cx="200" cy="580" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bb0000" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#bb0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-gold" cx="1214" cy="76" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc94d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffc94d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dots-fade" cx="1214" cy="260" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.5" fill="#ffffea" fill-opacity="0.12"/>
    </pattern>
    <mask id="dots-mask">
      <rect width="1544" height="500" fill="url(#dots-fade)"/>
    </mask>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="96" y1="280" x2="700" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd970"/>
      <stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
    <linearGradient id="gold-text-details" x1="96" y1="224" x2="700" y2="284" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd970"/>
      <stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
    <linearGradient id="top-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#bb0000"/>
    </linearGradient>
    <linearGradient id="top-cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a8a"/>
      <stop offset="1" stop-color="#e03131"/>
    </linearGradient>
    <linearGradient id="top-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c81e1e"/>
      <stop offset="1" stop-color="#7a0000"/>
    </linearGradient>
    <!-- A five-pointed star, radius 1, centred on 0,0 -->
    <polygon id="star" points="0,-1 0.2245,-0.309 0.9511,-0.309 0.3633,0.118 0.5878,0.809 0,0.382 -0.5878,0.809 -0.3633,0.118 -0.9511,-0.309 -0.2245,-0.309"/>
  </defs>

  <!-- Background -->
  <rect width="1544" height="500" fill="url(#bg)"/>
  <rect width="1544" height="500" fill="url(#glow-red)"/>
  <rect width="1544" height="500" fill="url(#glow-blue)"/>
  <rect width="1544" height="500" fill="url(#dots)" mask="url(#dots-mask)"/>

  <!-- wpallstars.com's red double lines, with a cream line between them. -->
  <g>
    <rect y="0" width="1544" height="6" fill="#bb0000"/>
    <rect y="6" width="1544" height="5" fill="#ffffea"/>
    <rect y="11" width="1544" height="6" fill="#bb0000"/>
    <rect y="483" width="1544" height="6" fill="#bb0000"/>
    <rect y="489" width="1544" height="5" fill="#ffffea"/>
    <rect y="494" width="1544" height="6" fill="#bb0000"/>
  </g>

  <!-- The picture: scaled down a little so it keeps clear of the stripes -->
  <g transform="translate(1214 248) scale(0.86) translate(-1214 -248)">
  <!-- The stack: three red tiles, each with a top face and two sides. The
       gradient names (top-blue, top-cream, top-red, bottom to top) are the
       layers of plugins with red, cream and blue tiles: plugins vary only
       the tiles' colours and the top tile's picture (STANDARDS.md → Structure). -->
  <g stroke-linejoin="round">
    <g transform="translate(0 350)">
      <polygon points="1064,0 1214,87 1214,117 1064,30" fill="#5c0000"/>
      <polygon points="1214,87 1364,0 1364,30 1214,117" fill="#420000"/>
      <polygon points="1214,-87 1364,0 1214,87 1064,0" fill="url(#top-blue)"/>
      <polygon points="1214,-61 1319,0 1214,61 1109,0" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
    </g>
    <g transform="translate(0 294)">
      <polygon points="1064,0 1214,87 1214,117 1064,30" fill="#c22424"/>
      <polygon points="1214,87 1364,0 1364,30 1214,117" fill="#9e1414"/>
      <polygon points="1214,-87 1364,0 1214,87 1064,0" fill="url(#top-cream)"/>
      <polygon points="1214,-61 1319,0 1214,61 1109,0" fill="none" stroke="#001537" stroke-opacity="0.18" stroke-width="2"/>
    </g>
    <g transform="translate(0 238)">
      <polygon points="1064,0 1214,87 1214,117 1064,30" fill="#940000"/>
      <polygon points="1214,87 1364,0 1364,30 1214,117" fill="#700000"/>
      <polygon points="1214,-87 1364,0 1214,87 1064,0" fill="url(#top-red)"/>
      <!-- SEO Pro Custom's picture: the usual "fork" symbol (two branch ends
           above, the trunk below, drawn here, not copied from an icon set):
           your own copy of the code, branched off ours. Laid flat on the top
           face through the face matrix every plugin's top-tile picture uses:
           drawn upright in a 20-unit space (0 to 20 on both axes, centre
           10,10) and turned 45 degrees, so the trunk points at the viewer
           (STANDARDS.md → Structure). -->
      <g transform="matrix(4.95 2.871 -4.95 2.871 1214 -57.42)">
        <g transform="translate(0.3 0.3) rotate(-45 10 10)" fill="#5c0000" stroke="#5c0000" opacity="0.55">
          <path fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 6.5V8.1Q5 10.6 7.5 10.6H12.5Q15 10.6 15 8.1V6.5M10 10.6V14.1"/>
          <circle cx="5" cy="4" r="2.5" stroke="none"/>
          <circle cx="15" cy="4" r="2.5" stroke="none"/>
          <circle cx="10" cy="16.6" r="2.5" stroke="none"/>
        </g>
        <g transform="rotate(-45 10 10)" fill="#ffffea" stroke="#ffffea">
          <path fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 6.5V8.1Q5 10.6 7.5 10.6H12.5Q15 10.6 15 8.1V6.5M10 10.6V14.1"/>
          <circle cx="5" cy="4" r="2.5" stroke="none"/>
          <circle cx="15" cy="4" r="2.5" stroke="none"/>
          <circle cx="10" cy="16.6" r="2.5" stroke="none"/>
        </g>
      </g>
    </g>
  </g>

  <!-- The logo's arc of five stars: gold in the middle, floating above the stack -->
  <circle cx="1214" cy="76" r="120" fill="url(#glow-gold)"/>
  <g stroke-linejoin="round">
    <g fill="#bb0000" stroke="#ffffea" stroke-width="5">
      <use xlink:href="#star" transform="translate(1043 150) scale(17)" stroke-width="0.3"/>
      <use xlink:href="#star" transform="translate(1110 100) scale(26)" stroke-width="0.2"/>
      <use xlink:href="#star" transform="translate(1318 100) scale(26)" stroke-width="0.2"/>
      <use xlink:href="#star" transform="translate(1385 150) scale(17)" stroke-width="0.3"/>
    </g>
    <use xlink:href="#star" transform="translate(1214 78) scale(54)" fill="url(#gold)" stroke="#ffffea" stroke-width="0.11"/>
  </g>
  </g>

  <!-- Words, twice: the same five lines in two places (STANDARDS.md →
       Structure, listing images). scripts/build-banner.sh keeps one group
       per output; change the words in both.
       words: centred top to bottom, for the README and the Read Me tab.
       words-details: all above y 340, for View details (Plugins and
       Updates screens) and WordPress.org, where WordPress writes the
       plugin name in a dark box over the lower left, y 348 to 448 here. -->
  <g id="words" font-family="Zilla Slab" text-rendering="geometricPrecision">
    <text x="98" y="112" font-size="27" font-weight="600" letter-spacing="5" fill="#ff999b">WPALLSTARS</text>
    <text x="92" y="216" font-size="104" font-weight="700" font-style="italic" letter-spacing="-1" fill="#ffffea">SEO Pro Custom</text>
    <text x="96" y="296" font-size="64" font-weight="700" font-style="italic" fill="url(#gold-text)">Customise your site safely</text>
    <text x="98" y="358" font-size="32" font-weight="500" fill="#c2cad6">Have your AI code overrides for your theme &amp; plugins' features</text>
    <text x="98" y="400" font-size="32" font-weight="500" fill="#c2cad6">without having to negotiate or wait on upstream.</text>
  </g>
  <g id="words-details" display="none" font-family="Zilla Slab" text-rendering="geometricPrecision">
    <text x="98" y="68" font-size="27" font-weight="600" letter-spacing="5" fill="#ff999b">WPALLSTARS</text>
    <text x="92" y="164" font-size="104" font-weight="700" font-style="italic" letter-spacing="-1" fill="#ffffea">SEO Pro Custom</text>
    <text x="96" y="238" font-size="64" font-weight="700" font-style="italic" fill="url(#gold-text-details)">Customise your site safely</text>
    <text x="98" y="290" font-size="30" font-weight="500" fill="#c2cad6">Have your AI code overrides for your theme &amp; plugins' features</text>
    <text x="98" y="328" font-size="30" font-weight="500" fill="#c2cad6">without having to negotiate or wait on upstream.</text>
  </g>
</svg>
